function computeGumDist(){
  gumDist.fill(999);const gq=[];
  for(let k=0;k<N;k++)if(type[k]===GUM){gumDist[k]=0;gq.push(k);}
  for(let h=0;h<gq.length;h++){const k=gq[h],x=k%GW,y=(k/GW)|0;
    const nb=[x>0?k-1:-1,x<GW-1?k+1:-1,y>0?k-GW:-1,y<GH-1?k+GW:-1];
    for(const n of nb)if(n>=0&&gumDist[n]>gumDist[k]+1){gumDist[n]=gumDist[k]+1;gq.push(n);}}

// how deep each gum cell sits behind the gum's lower edge
function computeGumDepth(){
  const q=[];
  for(let k=0;k<N;k++){if(type[k]!==GUM)continue;const x=k%GW,y=(k/GW)|0;
    if((y<GH-1&&type[k+GW]!==GUM&&!under[k+GW])||(x>0&&type[k-1]!==GUM&&!under[k-1])||(x<GW-1&&type[k+1]!==GUM&&!under[k+1])){gdepth[k]=1;q.push(k);}}
  for(let h=0;h<q.length;h++){const k=q[h],x=k%GW,y=(k/GW)|0;
    const nb=[x>0?k-1:-1,x<GW-1?k+1:-1,y>0?k-GW:-1,y<GH-1?k+GW:-1];
    for(const n of nb)if(n>=0&&type[n]===GUM&&!gdepth[n]){gdepth[n]=gdepth[k]+1;q.push(n);}}

    else if(keep&&gumCut[k]&&(type[k]===EMPTY||type[k]===TOOTH)&&!cavf[k]){type[k]=GUM;gumCut[k]=0;}}

    const x=cx+i-(w>>1),y=cy+j-(h>>1);if(x<0||x>=GW||y<0||y>=GH-7)continue;const k=y*GW+x;

    if(!id){if(chunkInfo.length>=250)return;id=chunkInfo.length;chunkInfo.push({alive:false});}

    balls=balls.concat(add);tone(700,0.2,'square',0.05,700);}
  else if(kind==='S'){flossT+=FLOSS_SEC;tone(1400,0.3,'triangle',0.05,-600);}
  else if(kind==='Q'){fastT+=10;slowT=0;tone(700,0.25,'square',0.045,700);}
  else if(kind==='L'){slowT+=10;fastT=0;tone(500,0.3,'triangle',0.05,-250);}
  else if(kind==='H'){holdT+=14;tone(520,0.2,'square',0.045,260);}
  else if(kind==='W'){wideT+=14;tone(440,0.25,'triangle',0.05,440);}
  else if(kind==='M'){freezeT+=10;tone(880,0.35,'triangle',0.05,400);}
  else if(kind==='B'){drillTooth();if(!RM)shake=0.35;winceT=0.8;tone(140,0.4,'sawtooth',0.06,-70);}
  else if(kind==='G'){if(gumHurt>0){gumHurt=Math.max(0,gumHurt-2);applyGum();}else addScore(50);tone(620,0.3,'triangle',0.05,300);}
  else{addPlaque(80);spawnFood(2);if(!RM)shake=0.35;tone(200,0.3,'sawtooth',0.06,-120);}
}

/* ---------- physics ---------- */
function solidAt(x,y,r){
  const x0=Math.floor((x-r)/CS),x1=Math.floor((x+r)/CS),y0=Math.floor((y-r-GY)/CS),y1=Math.floor((y+r-GY)/CS);
  for(let gy=y0;gy<=y1;gy++){if(gy<0||gy>=GH)continue;for(let gx=x0;gx<=x1;gx++){if(gx<0||gx>=GW)continue;
    const t=type[gy*GW+gx];if(t!==TOOTH&&t!==GUM)continue;const cx=gx*CS,cy=GY+gy*CS;
    const nx=clamp(x,cx,cx+CS),ny=clamp(y,cy,cy+CS);if((x-nx)*(x-nx)+(y-ny)*(y-ny)<r*r)return true;}}
  return false;
}
function hitCells(b,x,y){
  const r=b.r,R=r+4.5,x0=Math.floor((x-R)/CS),x1=Math.floor((x+R)/CS),y0=Math.floor((y-R-GY)/CS),y1=Math.floor((y+R-GY)/CS);
  let bounce=false,dx=-1,dy=-1;
  for(let gy=y0;gy<=y1;gy++){if(gy<0||gy>=GH)continue;for(let gx=x0;gx<=x1;gx++){if(gx<0||gx>=GW)continue;
    const k=gy*GW+gx,t=type[k];if(!t&&!cavf[k])continue;const cx=gx*CS,cy=GY+gy*CS;
    const nx=clamp(x,cx,cx+CS),ny=clamp(y,cy,cy+CS),d2=(x-nx)*(x-nx)+(y-ny)*(y-ny);
    if(!t){if(d2<R*R)fizzStart(k);continue;}
    if(t===PLAQUE){if(d2<R*R){removeCell(k,true);b.idle=0;tick();}continue;}
    if(d2>=r*r)continue;
    if(t===TOOTH||t===GUM){bounce=true;if(t===GUM)gumHit=true;}
    else if(t===DEBRIS){burst(chunk[k]);bounce=true;b.idle=0;}
    else if(t===DECAY){b.idle=0;if(dx<0){dx=gx;dy=gy;}}}}
  if(dx>=0){
    for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const gx=dx+i,gy=dy+j;if(gx<0||gx>=GW||gy<0||gy>=GH)continue;
      const k=gy*GW+gx;if(type[k]!==DECAY)continue;removeCell(k,true);}
    fizzStart(dy*GW+dx);
    winceT=0.3;b.slow=0.09;const n=performance.now();if(n-lastFizz>70){lastFizz=n;tone(170+Math.random()*60,0.07,'sawtooth',0.035,-50);}}
  return bounce;
}
function unstick(b){
  for(let d=2;d<=60;d+=2)for(let a=0;a<16;a++){const an=a*Math.PI/8+Math.PI/2,x=b.x+Math.cos(an)*d,y=b.y+Math.sin(an)*d;
    if(x<b.r||x>W-b.r||y<GY+b.r||y>PADY-20)continue;
    if(!solidAt(x,y,b.r)){b.x=x;b.y=y;return;}}
}
function moveBall(b,dt){
  if(b.slow>0)b.slow-=dt;if(b.gumCd>0)b.gumCd-=dt;
  let rem=S.speed*dt*(b.slow>0?0.5:1)*(slowT>0?0.6:fastT>0?1.4:1);
  while(rem>0){const s=Math.min(rem,2);rem-=s;let free=solidAt(b.x,b.y,b.r);
    if(free){unstick(b);free=solidAt(b.x,b.y,b.r);}
    let nx=b.x+b.vx*s;
    if(nx<b.r){nx=b.r;b.vx=Math.abs(b.vx);}else if(nx>W-b.r){nx=W-b.r;b.vx=-Math.abs(b.vx);}
    gumHit=false;
    if(hitCells(b,nx,b.y)&&!free){b.vx=-b.vx;wobT=0;wobDir=b.vx<0?1:-1;}else b.x=nx;
    let ny=b.y+b.vy*s;
    if(ny<GY+b.r){ny=GY+b.r;b.vy=Math.abs(b.vy);}
    if(hitCells(b,b.x,ny)&&!free){b.vy=-b.vy;wobT=0;}else b.y=ny;
    if(gumHit&&!free&&gumCool<=0){gumCool=3;hurtGum();}
    if(b.vy>0&&b.y+b.r>=PADY&&b.y+b.r<=PADY+12&&Math.abs(b.x-pad.x)<=pad.w/2+b.r){
      if(holdT>0){b.stuck=true;b.off=clamp(b.x-pad.x,-pad.w/2,pad.w/2);b.idle=0;tone(360,0.06,'triangle',0.05);return;}
      const o=clamp((b.x-pad.x)/(pad.w/2),-1,1),a=-Math.PI/2+o*1.1;
      b.vx=Math.cos(a);b.vy=Math.sin(a);b.y=PADY-b.r;b.idle=0;tone(440,0.05,'triangle',0.05);}
    if(flossT>0&&b.vy>0&&b.y+b.r>=FLOSS_Y&&b.y+b.r<=FLOSS_Y+10){b.vy=-b.vy;b.y=FLOSS_Y-b.r;b.idle=0;tone(980,0.05,'triangle',0.05);}
    if(b.y>H-FOOT+8){b.dead=true;return;}
  }
  if(Math.abs(b.vy)<0.2){b.vy=(b.vy<0?-0.2:0.2);const l=Math.hypot(b.vx,b.vy);b.vx/=l;b.vy/=l;}
  b.idle+=dt;
  if(b.idle>7){const a=Math.atan2(b.vy,b.vx)+(Math.random()-0.5)*0.9;b.vx=Math.cos(a);b.vy=Math.sin(a);b.idle=0;}
}
// sway angle in degrees for the number of gum hits so far
function wobbleDeg(){const h=gumHurt;
  return h<3?0:h===3?0.7:h===4?1.2:1.8;}
function hurtGum(){
  gumHurt++;gumRest=0;applyGum();winceT=0.4;tone(150,0.09,'sawtooth',0.05,-40);
  if(gumHurt>=GUM_MAX){lostWhy='gum';toothLost();}
  else if(!gumTold){gumTold=true;say('歯ぐきに当てるとやせて、歯がぐらつく');}
  else if(gumHurt===3)say('歯がぐらつきはじめた');
  else if(gumHurt===GUM_MAX-1)say('歯ぐきがやせて、歯が抜けそう');
}
function launch(){
  const a=aimAngle();let any=false;
  for(const b of balls)if(b.stuck){b.vx=Math.cos(a);b.vy=Math.sin(a);b.stuck=false;any=true;}
  if(!any)return;st.mode='play';tone(600,0.08,'triangle',0.05,300);
}
function canLaunch(){return st.mode==='ready'||(st.mode==='play'&&balls.some(b=>b.stuck));}
// decay left alone eats further into the tooth; reaching the gum pulls the tooth out
function growCavity(sec){
  const fr=[];
  for(let k=0;k<N;k++){if(type[k]!==DECAY||!cavf[k])continue;const x=k%GW,y=(k/GW)|0;
    if(y>0&&type[k-GW]===TOOTH)fr.push(k-GW,k-GW,k-GW,k-GW);
    if(x>0&&type[k-1]===TOOTH)fr.push(k-1,k-1);
    if(x<GW-1&&type[k+1]===TOOTH)fr.push(k+1,k+1);
    if(y<GH-1&&type[k+GW]===TOOTH)fr.push(k+GW);}
  if(!fr.length)return;
  // every exposed edge spreads at its own pace, so a nearly clean cavity grows slowly
  const want=fr.length*S.rot*DECAY_SPEED*sec;let n=Math.floor(want)+(Math.random()<want%1?1:0);
  while(n-->0){const q=fr[(Math.random()*fr.length)|0];if(type[q]!==TOOTH)continue;
    type[q]=DECAY;hp[q]=1;cavf[q]=1;remaining++;dirty=true;
    if(gumDist[q]<=1){lostWhy='decay';toothLost();return;}}
  if(remaining>total0)total0=remaining;
}
// a cavity with no decay left gets a filling, so foam can no longer go in
let fillQ=[],sealTold=false;const seen=new Uint8Array(N);
function sealCavities(){
  seen.fill(0);
  for(let k0=0;k0<N;k0++){
    if(seen[k0]||!cavf[k0]||(type[k0]!==EMPTY&&type[k0]!==DECAY))continue;
    const comp=[k0];let bad=false;seen[k0]=1;
    for(let h=0;h<comp.length;h++){const k=comp[h],x=k%GW,y=(k/GW)|0;if(type[k]===DECAY)bad=true;
      for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const gx=x+i,gy=y+j;if(gx<0||gx>=GW||gy<0||gy>=GH)continue;
        const q=gy*GW+gx;if(seen[q]||!cavf[q]||(type[q]!==EMPTY&&type[q]!==DECAY))continue;seen[q]=1;comp.push(q);}}
    if(bad)continue;
    let busy=false;
    for(const b of balls){if(busy)break;const rr2=(b.r+2)*(b.r+2);
      for(const k of comp){const cx=(k%GW)*CS,cy=GY+((k/GW)|0)*CS;
        const nx=clamp(b.x,cx,cx+CS),ny=clamp(b.y,cy,cy+CS);if((b.x-nx)*(b.x-nx)+(b.y-ny)*(b.y-ny)<rr2){busy=true;break;}}}
    if(busy)continue; // wait until the foam has left
    for(const k of comp){type[k]=TOOTH;filled[k]=1;cavf[k]=0;
      if(!RM&&Math.random()<0.12){const p=cellXY(k);puff(p[0],p[1],'#ffffff',1,30);}}
    dirty=true;addScore(100);
    if(!sealTold){sealTold=true;say('虫歯を取りきった穴に詰め物をした');}
    tone(880,0.12,'triangle',0.05,440);
  }
}
function crumble(){
  const open=t=>t!==TOOTH&&t!==GUM;
  for(let pass=0;pass<2;pass++){let any=false;
    for(let k=0;k<N;k++){if(type[k]!==TOOTH)continue;const x=k%GW,y=(k/GW)|0;
      let near=false;
      for(let j=-1;j<=1&&!near;j++)for(let i=-1;i<=1;i++){const gx=x+i,gy=y+j;
        if(gx>=0&&gx<GW&&gy>=0&&gy<GH&&cavf[gy*GW+gx]){near=true;break;}}
      if(!near)continue;
      // length of the run of tooth through this cell, across and down
      let l=x,r=x;while(l>0&&type[k-(x-l)-1]===TOOTH&&x-l<4)l--;while(r<GW-1&&type[k+(r-x)+1]===TOOTH&&r-x<4)r++;
      let u=y,d=y;while(u>0&&type[k-(y-u+1)*GW]===TOOTH&&y-u<4)u--;while(d<GH-1&&type[k+(d-y+1)*GW]===TOOTH&&d-y<4)d++;
      const thinX=r-l+1<=3&&l>0&&r<GW-1&&open(type[y*GW+l-1])&&open(type[y*GW+r+1]);
      const thinY=d-u+1<=3&&u>0&&d<GH-1&&open(type[(u-1)*GW+x])&&open(type[(d+1)*GW+x]);
      if(thinX||thinY){type[k]=EMPTY;cavf[k]=1;any=true;if(Math.random()<0.4){const p=cellXY(k);puff(p[0],p[1],'#ffffff',1,40);}}}
    if(!any)break;dirty=true;}
}
const fallC=document.createElement('canvas');fallC.width=GW;fallC.height=GH;const fctx=fallC.getContext('2d');
function toothLost(){
  if(falling)return;paintGrid();
  const d=fctx.createImageData(GW,GH);d.data.set(gimg.data);
  for(let k=0;k<N;k++){if(type[k]===GUM)d.data[k*4+3]=0;else{type[k]=EMPTY;cavf[k]=0;}}
  fctx.putImageData(d,0,0);dirty=true;
  falling=true;fallT=0;st.mode='fall';balls=[];items=[];winceT=9;msg.t=0;
  tone(260,0.7,'sawtooth',0.07,-200);
}
function aimAngle(){return -Math.PI/2+Math.sin(aimT*1.7)*0.95;}
function cavLeft(){let c=0;for(let k=0;k<N;k++)if(cavf[k]&&type[k]===DECAY)c++;return c;}
function win(){
  st.mode='clear';clearT=0;balls=[];items=[];fillQ.length=0;
  for(let k=0;k<N;k++)if(type[k]>=PLAQUE){const p=cellXY(k);puff(p[0],p[1],'#fff',1,90);type[k]=EMPTY;}
  remaining=0;dirty=true;fillList=[];
  for(let k=N-1;k>=0;k--)if(cavf[k]&&type[k]===EMPTY)fillList.push(k);
  [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.18,'triangle',0.06),i*110));
}

/* ---------- update ---------- */
function update(dt){
  if(st.mode==='title'||st.mode==='over'||st.mode==='done')return;
  const dir=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0);
  if(dir)pad.x+=dir*430*dt;pad.x=clamp(pad.x,pad.w/2,W-pad.w/2);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;p.life-=dt;}
  parts=parts.filter(p=>p.life>0);
  if(msg.t>0)msg.t-=dt;if(winceT>0)winceT-=dt;if(shake>0)shake-=dt;
  if(st.mode==='fall'){fallT+=dt;if(fallT>1.5){st.mode='over';show('lost');}return;}
  if(st.mode==='clear'){
    clearT+=dt;
    for(let i=0;i<5&&fillList.length;i++){const k=fillList.pop();type[k]=TOOTH;filled[k]=1;dirty=true;}
    if(Math.random()<0.5){const a=Math.random()*6.283;puff(180+Math.cos(a)*120,GY+180+Math.sin(a)*150,'#ffd23f',1,20);}
    if(!fillList.length&&clearT>1.6){
      st.total+=st.time;addScore(300+st.lives*100);saveBest();
      if(st.stage<STAGES.length-1){st.mode='over';show('clear');}else{st.mode='done';show('done');}}
    return;
  }
  pad.w=wideT>0?96:64;pad.x=clamp(pad.x,pad.w/2,W-pad.w/2);aimT+=dt;
  if(st.mode==='ready'){const b=balls[0];if(b){b.x=pad.x;b.y=PADY-b.r-1;}return;}
  // play
  st.time+=dt;
  if(bigT>0)bigT-=dt;if(flossT>0)flossT-=dt;if(slowT>0)slowT-=dt;if(fastT>0)fastT-=dt;if(holdT>0)holdT-=dt;if(wideT>0)wideT-=dt;if(freezeT>0)freezeT-=dt;
  const r=bigT>0?5.5:3;
  for(const b of balls){b.r=r;
    if(b.stuck){b.x=clamp(pad.x+(b.off||0),r,W-r);b.y=PADY-r-1;}else moveBall(b,dt);
    if(st.mode!=='play')return;}
  balls=balls.filter(b=>!b.dead);
  for(const it of items){it.y+=it.vy*dt;
    if(it.y+8>=PADY&&it.y-8<=PADY+12&&Math.abs(it.x-pad.x)<pad.w/2+8){it.dead=true;useItem(it.kind);}
    else if(it.y>H+12)it.dead=true;}
  items=items.filter(i=>!i.dead);
  fizzStep(dt);
  if(freezeT<=0){
    growT+=dt;if(growT>=S.grow/PLAQUE_SPEED){growT=0;growDecay();}
    rotT+=dt;if(rotT>=0.25){rotT-=0.25;growCavity(0.25);if(st.mode==='play')crumble();}
    if(st.mode!=='play')return;
  }
  for(let i=0;i<8&&fillQ.length;i++){const k=fillQ.shift();if(type[k]===EMPTY&&cavf[k]){type[k]=TOOTH;filled[k]=1;cavf[k]=0;dirty=true;
    if(!RM&&Math.random()<0.15){const p=cellXY(k);puff(p[0],p[1],'#ffffff',1,30);}}}
  dangerT+=dt;if(dangerT>=0.5){dangerT=0;if(freezeT>0)crumble();if(!fillQ.length&&!fizzQ.length)sealCavities();dangerD=999;
    for(let k=0;k<N;k++)if(type[k]===DECAY&&cavf[k]&&gumDist[k]<dangerD)dangerD=gumDist[k];
    if(dangerD<=12&&!dangerTold){dangerTold=true;say('虫歯が歯ぐきに近づいている');}
    if(dangerD>16)dangerTold=false;}
  wobT+=dt;if(gumCool>0)gumCool-=dt;
  fakeT-=dt;if(fakeT<=0){fakeT=30+Math.random()*16;items.push({x:24+Math.random()*(W-48),y:GY+4,kind:'B',vy:80});}
  gumDropT-=dt;if(gumDropT<=0){if(gumHurt>0){gumDropT=12+Math.random()*6;items.push({x:24+Math.random()*(W-48),y:GY+4,kind:'G',vy:80});}else gumDropT=5;}
  candyT-=dt;if(candyT<=0){candyT=22+Math.random()*12;items.push({x:24+Math.random()*(W-48),y:GY+4,kind:'A',vy:80});}
  if(remaining<=Math.max(12,total0*0.10)&&cavLeft()<=Math.max(6,cav0*0.06)){win();return;}
  if(!balls.length){
    st.lives--;bigT=0;flossT=0;tone(300,0.4,'sawtooth',0.06,-220);if(!RM)shake=0.3;
    if(st.lives<=0){st.mode='over';saveBest();try{localStorage.setItem('hamigaki-stage','0');}catch(e){}show('over');}
    else{newBall();st.mode='ready';aimT=0;say('泡を落とした。のこり '+st.lives);}
  }
}

/* ---------- draw ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawFace(){for(const f of (S.faces||[S.face]))drawOneFace(f);}
function drawOneFace(f){
  const dirt=remaining/total0,happy=st.mode==='clear'||st.mode==='done'||remaining===0;
  ctx.save();ctx.translate(f.x*CS,GY+f.y*CS);ctx.rotate(f.rot);
  ctx.strokeStyle=ctx.fillStyle='#3b2438';ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';
  const ex=f.ex;
  if(happy){for(const s of [-1,1]){ctx.beginPath();ctx.moveTo(s*ex-6,2);ctx.lineTo(s*ex,-4);ctx.lineTo(s*ex+6,2);ctx.stroke();}}
  else if(winceT>0){for(const s of [-1,1]){ctx.beginPath();ctx.moveTo(s*ex-s*5,-5);ctx.lineTo(s*ex+s*3,0);ctx.lineTo(s*ex-s*5,5);ctx.stroke();}}
  else{ctx.fillRect(-ex-3,-4,6,9);ctx.fillRect(ex-3,-4,6,9);
    if(dirt>0.55){ctx.beginPath();ctx.moveTo(-ex-8,-12);ctx.lineTo(-ex+5,-9);ctx.moveTo(ex+8,-12);ctx.lineTo(ex-5,-9);ctx.stroke();}}
  ctx.beginPath();
  if(happy){ctx.arc(0,20,11,0,Math.PI);ctx.closePath();ctx.fill();ctx.fillStyle='#ff8ea3';ctx.beginPath();ctx.arc(0,27,5,0,Math.PI);ctx.fill();}
  else if(winceT>0){ctx.arc(0,26,4,0,7);ctx.stroke();}
  else if(dirt>0.55){ctx.arc(0,36,10,Math.PI*1.2,Math.PI*1.8);ctx.stroke();}
  else if(dirt>0.2){ctx.moveTo(-7,27);ctx.lineTo(7,27);ctx.stroke();}
  else{ctx.arc(0,19,10,Math.PI*0.2,Math.PI*0.8);ctx.stroke();}
  if(happy||dirt<=0.2){ctx.fillStyle='rgba(255,120,150,.45)';for(const s of [-1,1]){ctx.beginPath();ctx.ellipse(s*(ex+9),13,7,4,0,0,7);ctx.fill();}}
  if(!happy&&dirt>0.55){ctx.fillStyle='#8fd3ff';ctx.beginPath();ctx.moveTo(ex+14,-16);ctx.quadraticCurveTo(ex+20,-6,ex+14,-4);
    ctx.quadraticCurveTo(ex+8,-6,ex+14,-16);ctx.fill();}
  ctx.restore();
}
function drawBrush(){
  const x=pad.x-pad.w/2;
  for(let i=0;i<pad.w/4;i++){ctx.fillStyle=i%2?'#ffffff':'#d3e4ff';ctx.fillRect(x+i*4,PADY+(i%2?0:1),4,8);}
  ctx.fillStyle='#3567c9';rr(x-4,PADY+7,pad.w+8,7,3);ctx.fill();
  ctx.fillStyle='#27509e';ctx.fillRect(x-1,PADY+12,pad.w+2,2);
}
function drawItem(it){
  const d=ITEMS[it.kind];ctx.save();ctx.translate(it.x,it.y);
  if(it.kind==='G'||it.kind==='B'){ // toothpaste tube; the fake differs only in colour and mark
    const fake=it.kind==='B';
    ctx.rotate(-0.3);ctx.strokeStyle='#24406b';ctx.lineWidth=1.5;ctx.lineJoin='round';
    const body=()=>{ctx.beginPath();ctx.moveTo(-9,13);ctx.lineTo(9,13);ctx.lineTo(9,10);ctx.lineTo(5.5,-7);ctx.lineTo(3,-10);
      ctx.lineTo(-3,-10);ctx.lineTo(-5.5,-7);ctx.lineTo(-9,10);ctx.closePath();};
    ctx.fillStyle='#ffffff';body();ctx.fill();
    ctx.fillStyle=fake?'#8e6bd6':'#19b5a5';ctx.beginPath();ctx.moveTo(-7.9,5);ctx.lineTo(7.9,5);ctx.lineTo(6.6,-2);ctx.lineTo(-6.6,-2);ctx.closePath();ctx.fill();
    ctx.fillStyle='#ffffff';
    if(fake){ctx.save();ctx.translate(0,1.5);ctx.rotate(0.785);ctx.fillRect(-1,-2.6,2,5.2);ctx.fillRect(-2.6,-1,5.2,2);ctx.restore();}
    else{ctx.fillRect(-1,-0.8,2,4.6);ctx.fillRect(-2.3,0.5,4.6,2);}
    body();ctx.stroke();ctx.beginPath();ctx.moveTo(-9,10);ctx.lineTo(9,10);ctx.stroke();
    ctx.fillStyle=fake?'#5b4a86':'#ff7fa3';ctx.fillRect(-3.5,-15.5,7,5.5);ctx.strokeRect(-3.5,-15.5,7,5.5);
    ctx.restore();return;}
  if(it.kind==='A'){ctx.fillStyle='#ffb3c1';ctx.beginPath();ctx.moveTo(-8,0);ctx.lineTo(-15,-6);ctx.lineTo(-15,6);ctx.closePath();
    ctx.moveTo(8,0);ctx.lineTo(15,-6);ctx.lineTo(15,6);ctx.closePath();ctx.fill();}
  ctx.fillStyle=d.bg;ctx.beginPath();ctx.arc(0,0,9,0,7);ctx.fill();ctx.strokeStyle='#24406b';ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle=d.fg;ctx.font='12px DotGothic16, monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(d.label,0,1);
  ctx.restore();
}
function draw(){
  ctx.setTransform(2,0,0,2,0,0);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#9fdcf0');g.addColorStop(1,'#bdeee0');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.3)';for(let i=0;i<11;i++){ctx.beginPath();ctx.arc((i*97+40)%W,472+(i*53)%160,4+(i*7)%9,0,7);ctx.fill();}
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*6,(Math.random()-0.5)*6);
  if(dirty)paintGrid();
  // a tooth with thin gum sways around the gum line
  const wob=falling?0:wobbleDeg()/57.3*Math.sin(performance.now()/160);
  ctx.save();ctx.translate(W/2,GY+56);ctx.rotate(wob);ctx.translate(-W/2,-(GY+56));
  ctx.imageSmoothingEnabled=false;ctx.drawImage(gridC,0,GY,GW*CS,GH*CS);ctx.imageSmoothingEnabled=true;
  if(!falling)drawFace();
  ctx.restore();
  ctx.imageSmoothingEnabled=false;ctx.drawImage(gumC,0,GY,GW*CS,GH*CS);ctx.imageSmoothingEnabled=true;
  if(falling){ctx.save();ctx.translate(W/2,GY+200+700*fallT*fallT);ctx.rotate(fallT*0.5);ctx.translate(-W/2,-(GY+200));
    ctx.imageSmoothingEnabled=false;ctx.drawImage(fallC,0,GY,GW*CS,GH*CS);ctx.imageSmoothingEnabled=true;drawFace();ctx.restore();}
  if(flossT>0&&(flossT>3||Math.floor(flossT*6)%2===0)){
    ctx.strokeStyle='#3567c9';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,FLOSS_Y+2);ctx.lineTo(W,FLOSS_Y+2);ctx.stroke();
    ctx.strokeStyle='#ffffff';ctx.lineWidth=2;ctx.setLineDash([6,4]);ctx.beginPath();ctx.moveTo(0,FLOSS_Y+2);ctx.lineTo(W,FLOSS_Y+2);ctx.stroke();ctx.setLineDash([]);
}
  for(const p of parts){ctx.globalAlpha=clamp(p.life*3,0,1);ctx.fillStyle=p.col;ctx.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);}
  ctx.globalAlpha=1;
  for(const it of items)drawItem(it);
  drawBrush();
  if(canLaunch()){const a=aimAngle();ctx.fillStyle='#24406b';
    for(const b of balls){if(!b.stuck)continue;
      for(let i=1;i<=11;i++){ctx.globalAlpha=1-i/13;ctx.fillRect(b.x+Math.cos(a)*i*13-1.5,b.y+Math.sin(a)*i*13-1.5,3,3);}}
    ctx.globalAlpha=1;}
  for(const b of balls){
    if(bigT>0){ctx.fillStyle='rgba(22,143,134,.25)';ctx.beginPath();ctx.arc(b.x,b.y,b.r+3,0,7);ctx.fill();}
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();
    ctx.strokeStyle='#168f86';ctx.lineWidth=1.5;ctx.stroke();}
  ctx.restore();
  // HUD
  ctx.fillStyle='rgba(255,255,255,.92)';ctx.fillRect(0,0,W,GY-4);
  ctx.textBaseline='middle';ctx.textAlign='left';ctx.font='13px DotGothic16, monospace';ctx.fillStyle='#24406b';
  const lab=(st.stage+1)+' '+S.name;ctx.fillText(lab,8,19);
  const mx=Math.max(100,ctx.measureText(lab).width+16),mw=204-mx;
  ctx.fillStyle='#cfe6f2';ctx.fillRect(mx,12,mw,12);
  const p=st.mode==='clear'||st.mode==='done'||remaining===0?100:pct();
  ctx.fillStyle='#19b5a5';ctx.fillRect(mx,12,mw*p/100,12);
  ctx.fillStyle='#24406b';ctx.font='13px DotGothic16, monospace';ctx.fillText(p+'%',210,19);
  // footer
  ctx.fillStyle='rgba(255,255,255,.94)';ctx.fillRect(0,H-FOOT,W,FOOT);
  {const act=[['F',bigT],['S',flossT],['L',slowT],['Q',fastT],['H',holdT],['W',wideT],['M',freezeT]].filter(e=>e[1]>0);
    ctx.font='20px DotGothic16, monospace';const sc=st.score+'点',sw=ctx.measureText(sc).width;
    const step=Math.min(46,(W-sw-30)/Math.max(1,act.length)),y=H-FOOT/2;
    act.forEach((e,i)=>{const d=ITEMS[e[0]],x=18+i*step;ctx.fillStyle=d.bg;ctx.beginPath();ctx.arc(x,y,11,0,7);ctx.fill();
      ctx.strokeStyle='#24406b';ctx.lineWidth=1.5;ctx.stroke();ctx.font='14px DotGothic16, monospace';ctx.fillStyle=d.fg;ctx.textAlign='center';ctx.fillText(d.label,x,y+1);
      ctx.font='13px DotGothic16, monospace';ctx.fillStyle='#24406b';ctx.textAlign='left';ctx.fillText(Math.ceil(e[1]),x+13,y+1);});
    ctx.fillStyle='#24406b';ctx.font='20px DotGothic16, monospace';ctx.textAlign='right';ctx.fillText(sc,W-10,y+1);ctx.textAlign='left';
}
  // gum gauge on the gum itself: one square per hit left, grouped into 4 blocks
  // [hit5] [hit4] [hit3] [hit2 hit1]: the first block takes two hits, each later block one; a gap sits wherever the sway angle steps up
  {const left=GUM_MAX-gumHurt;let x=8;const y=GY+6;
    for(let i=0;i<GUM_MAX;i++){const hitNo=GUM_MAX-i; // the hit that removes this square
      ctx.fillStyle=i<left?'#ffffff':'rgba(110,24,56,.3)';ctx.fillRect(x,y,13,12);
      x+=15;if(hitNo===5||hitNo===4||hitNo===3)x+=7;}}
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(262+i*17,18,5.5,0,7);
    if(i<st.lives){ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#168f86';ctx.lineWidth=2;ctx.stroke();}
    else{ctx.strokeStyle='#a9c6d6';ctx.lineWidth=1.5;ctx.stroke();}}
  ctx.textAlign='center';
  if(st.mode==='play'&&dangerD<=6){ctx.font='12px DotGothic16, monospace';
    const t='虫歯が歯ぐきに届きそう',w=ctx.measureText(t).width+16;
    ctx.globalAlpha=RM?1:0.85+0.15*Math.sin(performance.now()/380);
    ctx.fillStyle='#d6344e';rr(W-6-w,GY+3,w,20,5);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(t,W-6-w/2,GY+14);ctx.globalAlpha=1;}
  if(canLaunch()){ctx.fillStyle='#24406b';ctx.font='15px DotGothic16, monospace';
    ctx.fillText('タップ／スペースで泡を打つ',W/2,508);}
  if(msg.t>0&&st.mode!=='title'){ctx.globalAlpha=clamp(msg.t,0,1);ctx.font='14px DotGothic16, monospace';
    const w=ctx.measureText(msg.text).width+20;ctx.fillStyle='rgba(36,64,107,.92)';rr(W/2-w/2,468,w,24,6);ctx.fill();
    ctx.fillStyle='#ffffff';ctx.fillText(msg.text,W/2,481);ctx.globalAlpha=1;}
}

/* ---------- screens ---------- */
function show(kind){
  let html='',label='',extra='';
  if(kind==='title'){
    html='<h1><small>虫歯ブロック崩し</small>はみがき<br>ブレイカー</h1>'+
      '<p>歯ブラシで泡を打ち、汚れを落とすほど点が入る。食べかすを崩すとアイテムが出る。</p>'+
      '<ul><li><span class="chip k">◀▶</span>歯ブラシ：指・マウス・← →</li>'+
      '<li><span class="chip k">■</span>歯垢は放っておくと虫歯に変わる</li>'+
      '<li><span class="chip d">!</span>虫歯が歯ぐきまで広がると歯が抜ける</li>'+
      '<li><span class="chip g">!</span>歯ぐきに当てると歯がぐらつく</li></ul>'+
      '<ul class="items"><li><span class="chip">F</span>泡が大きく</li>'+
      '<li><span class="chip x">キ</span>泡が増える</li>'+
      '<li><span class="chip s">糸</span>泡が落ちない</li>'+
      '<li><span class="chip l">遅</span>泡がゆっくり</li>'+
      '<li><span class="chip q">速</span>泡が速くなる</li>'+
      '<li><span class="chip h">持</span>泡をキャッチ</li>'+
      '<li><span class="chip w">広</span>ブラシが広く</li>'+
      '<li><span class="chip m">う</span>虫歯が止まる</li>'+
      '<li><svg class="tube" viewBox="-12 -18 24 34" aria-hidden="true"><g transform="rotate(-17)" stroke="#24406b" stroke-width="1.5" stroke-linejoin="round"><path d="M-9 13H9V10L5.5-7 3-10H-3L-5.5-7-9 10Z" fill="#fff"/><path d="M-7.9 5H7.9L6.6-2H-6.6Z" fill="#19b5a5" stroke="none"/><path d="M-9 10H9"/><rect x="-3.5" y="-15.5" width="7" height="5.5" fill="#ff7fa3"/></g></svg>歯ぐきが回復</li>'+
      '<li><svg class="tube" viewBox="-12 -18 24 34" aria-hidden="true"><g transform="rotate(-17)" stroke="#24406b" stroke-width="1.5" stroke-linejoin="round"><path d="M-9 13H9V10L5.5-7 3-10H-3L-5.5-7-9 10Z" fill="#fff"/><path d="M-7.9 5H7.9L6.6-2H-6.6Z" fill="#8e6bd6" stroke="none"/><path d="M-9 10H9"/><rect x="-3.5" y="-15.5" width="7" height="5.5" fill="#5b4a86"/></g></svg>ニセ：穴があく</li>'+
      '<li><span class="chip a">ア</span>汚れと点が増える</li></ul>';
    /* iPhone のブラウザは Fullscreen API 非対応（動画のみ）。ホーム画面に追加すれば全画面で起動できるので案内する */
    const de=document.documentElement;
    if(matchMedia('(pointer: coarse)').matches&&!(de.requestFullscreen||de.webkitRequestFullscreen)
       &&!(navigator.standalone||matchMedia('(display-mode: standalone)').matches))
      html+='<p class="hint">全画面であそぶには、ブラウザの共有ボタンから「ホーム画面に追加」して開いてください。</p>';
    label=st.stage>0?((st.stage+1)+' '+STAGES[st.stage].name+'からつづける'):'みがきはじめる';
    if(st.stage>0)extra='<button id="reset" type="button">最初のコースからあそぶ</button>';
  }else if(kind==='clear'){
    html='<h1><small>'+S.name+'クリア</small>ピカピカ！</h1><p>'+S.name+'を '+fmt(st.time)+' でみがき終えた。</p><p>スコア '+st.score+'点</p>';
    label='つぎは'+STAGES[st.stage+1].name;
  }else if(kind==='over'){
    html='<h1><small>'+S.name+'</small>泡が<br>なくなった</h1><p>きれい度 '+pct()+'% まで進んだ。</p><p>スコア '+st.score+'点（最高 '+st.best+'点）</p><p>泡を3つ落としたので、つぎは最初のコースからスコア0でスタート。</p>';
    label='最初からみがく';
  }else if(kind==='lost'){
    html='<h1><small>'+S.name+'</small>歯が<br>抜けた</h1><p>'+(lostWhy==='gum'?'泡を当てすぎて歯ぐきがやせてしまった。上から降る歯みがき粉で回復できる。':'虫歯が歯ぐきまで広がってしまった。虫歯の穴は早めに泡を当てて掃除しよう。')+'</p><p>スコア '+st.score+'点</p>';
    label='もう一度みがく';
  }else{
    html='<h1><small>全ステージクリア</small>ぜんぶ<br>ピカピカ！</h1><p>全'+STAGES.length+'コースの合計タイムは '+fmt(st.total)+'。</p><p>スコア '+st.score+'点（最高 '+st.best+'点）</p>';
    label='最初からあそぶ';
  }
  screenEl.innerHTML=html+'<button id="go" type="button">'+label+'</button>'+extra;
  const rs=document.getElementById('reset');
  if(rs)rs.addEventListener('click',()=>{wake();goFull();screenEl.hidden=true;st.total=0;st.score=0;startStage(0,false);});
  screenEl.hidden=false;
  const go=document.getElementById('go');
  go.addEventListener('click',()=>{
    wake();goFull();screenEl.hidden=true;
    if(kind==='title'){st.score=0;startStage(st.stage,false);}
    else if(kind==='clear')startStage(st.stage+1,true);
    else if(kind==='over'){st.total=0;st.score=0;startStage(0,false);}
    else if(kind==='lost'){saveBest();st.score=st.scoreStart;startStage(st.stage,false);}
    else{st.total=0;st.score=0;startStage(0,false);}
  });
  try{go.focus({preventScroll:true});}catch(e){}
}

/* ---------- input ---------- */
let downX=null;
function setPad(e){const r=stageEl.getBoundingClientRect();pad.x=clamp((e.clientX-r.left)/r.width*W,pad.w/2,W-pad.w/2);}
cv.addEventListener('pointermove',e=>{if(st.mode==='ready'||st.mode==='play'||st.mode==='clear')setPad(e);});
cv.addEventListener('pointerdown',e=>{wake();downX=e.clientX;if(st.mode==='ready'||st.mode==='play')setPad(e);
  try{cv.setPointerCapture(e.pointerId);}catch(err){}});
cv.addEventListener('pointerup',e=>{if(canLaunch()&&downX!==null&&Math.abs(e.clientX-downX)<12)launch();downX=null;});
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){keys[e.key]=true;e.preventDefault();}
  if((e.key===' '||e.code==='Space')&&canLaunch()&&screenEl.hidden){wake();launch();e.preventDefault();}
});
window.addEventListener('keyup',e=>{keys[e.key]=false;});

/* ---------- boot ---------- */
let last=0;
function frame(t){const dt=Math.min(0.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(frame);}
function start(data){
  let saved=0;try{saved=parseInt(localStorage.getItem('hamigaki-stage'),10)||0;}catch(e){}
  const s=clamp(data&&Number.isInteger(data.stage)?data.stage:saved,0,STAGES.length-1);
  st.stage=s;st.total=data&&data.total||0;buildStage(s);newBall();st.mode='title';show('title');
  requestAnimationFrame(frame);
}
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({stage:st.stage,total:st.total}));}catch(e){}
window.__game={type,cavf,st,solidAt,items:()=>items,get wobble(){return wobbleDeg();},hurtGum,get why(){return lostWhy;},STAGES,useItem,startStage,growCavity,get danger(){return dangerD;},get gum(){return gumHurt;},get remaining(){return remaining;},get total(){return total0;},get balls(){return balls;},pad,launch,update};
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>
