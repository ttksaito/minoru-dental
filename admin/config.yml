# Decap CMS 設定（みのる歯科ブログ 記事管理）
# 管理画面: https://www.minoru-dental.jp/admin/
# 認証: GitHub OAuth（api/auth, api/callback のVercelサーバーレス関数経由）
# 注意: 本番ドメインはGitHub Pages配信（サーバーレス関数が動かない）ため、
#       OAuthのbase_urlのみVercelデプロイのURLを指定している

backend:
  name: github
  repo: ttksaito/minoru-dental
  branch: main
  base_url: https://minoru-dental.vercel.app
  auth_endpoint: api/auth
  commit_messages:
    create: '記事を追加: {{slug}}'
    update: '記事を更新: {{slug}}'
    delete: '記事を削除: {{slug}}'
    uploadMedia: '画像を追加: {{path}}'
    deleteMedia: '画像を削除: {{path}}'

# 下書き→レビュー中→公開準備完了→公開のワークフロー（「公開」するまでPRとして保留され、本番には出ない）
publish_mode: editorial_workflow

locale: ja

# 記事に紐づかない汎用画像の置き場所
media_folder: image/uploads
public_folder: /image/uploads

collections:
  - name: blog
    label: ブログ記事
    label_singular: 記事
    folder: content/blog
    create: true
    slug: '{{fields.slug}}'
    summary: '{{title}}（{{date}}）'
    sortable_fields: [date, title]
    fields:
      - label: 記事ID（URL用スラッグ）
        name: slug
        widget: string
        pattern: ['^[a-z0-9][a-z0-9-]*$', '英小文字・数字・ハイフンのみで入力してください（例: best-brushing-timing）']
        hint: '記事のURLになります。公開後は変更しないでください（例: best-brushing-timing → /blog/best-brushing-timing/）'
      - label: タイトル
        name: title
        widget: string
      - label: 著者
        name: author
        widget: select
        options:
          - { label: 'サイト運営（次男）', value: 'サイト運営' }
          - { label: '院長（斉藤 稔）', value: '院長' }
        default: 'サイト運営'
        hint: '記事末尾の著者欄と開示文、検索エンジン向けの著者情報に使われます。院長が執筆・確認した記事だけ「院長」にしてください'
      - label: 公開日
        name: date
        widget: datetime
        format: 'YYYY-MM-DD'
        date_format: 'YYYY-MM-DD'
        time_format: false
      - label: 最終更新日（任意）
        name: updated
        widget: datetime
        required: false
        default: ''
        format: 'YYYY-MM-DD'
        date_format: 'YYYY-MM-DD'
        time_format: false
        hint: '公開後に内容を見直したときに入力してください。記事ページの「最終更新日」と検索エンジン向けの更新日に反映されます'
      - label: タグ（カンマ区切り）
        name: tags
        widget: tagsWithAuto
        required: false
        hint: '任意。「本文から自動入力」ボタンで本文から判定してその場で入力できます。空のまま保存した場合も自動で付与されます。手動指定する例: 予防歯科, 歯磨き（既存タグ: 予防歯科 / 定期検診 / 歯磨き / 虫歯予防 / 小児歯科 / 歯周病 / 入れ歯 / 歯の豆知識）'
      - label: サムネイル画像
        name: image
        widget: image
        media_folder: '/blog/uploads'
        public_folder: '/blog/uploads'
        hint: '画像をアップロードしてください（日本語ファイル名でもOK。横長の画像を推奨）'
      - label: 本文
        name: body
        widget: markdown
        hint: '見出しは「見出し2」「見出し3」を使用してください'
