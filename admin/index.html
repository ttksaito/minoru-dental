<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>記事管理 | みのる歯科</title>
</head>
<body>
    <!-- Decap CMS（記事管理画面）。設定は同ディレクトリの config.yml -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
        // タグの自動付与
        // 1. タグ欄の「本文から自動入力」ボタン（カスタムウィジェット）: 押すとその場で欄に反映
        // 2. 保険: 空のまま保存した場合はpreSaveフックで保存データに自動付与
        // 判定ルールは tag-keywords.json（scripts/build-blog.js と共通）。
        (function () {
            var tagConfig = null;

            fetch('tag-keywords.json')
                .then(function (res) { return res.json(); })
                .then(function (json) { tagConfig = json; })
                .catch(function () {
                    console.warn('tag-keywords.json の読み込みに失敗しました。タグの自動付与は無効です。');
                });

            function inferTags(title, body) {
                var text = title + '\n' + body;
                var tags = tagConfig.rules
                    .filter(function (rule) {
                        return rule.keywords.some(function (kw) { return text.indexOf(kw) !== -1; });
                    })
                    .map(function (rule) { return rule.tag; })
                    .slice(0, tagConfig.maxTags);
                return tags.length > 0 ? tags : [tagConfig.fallback];
            }

            // カスタムウィジェット: テキスト欄＋「本文から自動入力」ボタン
            // （createClass / h はdecap-cms.jsがCDN利用向けに公開しているグローバル）
            var TagsWithAutoControl = createClass({
                handleChange: function (e) {
                    this.props.onChange(e.target.value);
                },
                handleAuto: function () {
                    if (!tagConfig) {
                        alert('判定ルールの読み込みに失敗しました。ページを再読み込みしてください。');
                        return;
                    }
                    var entry = this.props.entry;
                    var title = entry.getIn(['data', 'title']) || '';
                    var body = entry.getIn(['data', 'body']) || '';
                    if (!title && !body) {
                        alert('タイトルまたは本文を入力してから押してください。');
                        return;
                    }
                    this.props.onChange(inferTags(title, body).join(', '));
                },
                render: function () {
                    return h(
                        'div',
                        { style: { display: 'flex', gap: '8px', alignItems: 'stretch' } },
                        h('input', {
                            type: 'text',
                            id: this.props.forID,
                            className: this.props.classNameWrapper,
                            value: this.props.value || '',
                            onChange: this.handleChange,
                            style: { flex: '1' },
                        }),
                        h(
                            'button',
                            {
                                type: 'button',
                                onClick: this.handleAuto,
                                style: {
                                    whiteSpace: 'nowrap',
                                    padding: '0 16px',
                                    border: '2px solid #dfdfe3',
                                    borderRadius: '5px',
                                    background: '#f2f2f2',
                                    color: '#444',
                                    fontSize: '14px',
                                    cursor: 'pointer',
                                },
                            },
                            '本文から自動入力'
                        )
                    );
                },
            });
            CMS.registerWidget('tagsWithAuto', TagsWithAutoControl);

            // 保険: タグ欄が空のまま保存された場合は保存データに自動付与
            CMS.registerEventListener({
                name: 'preSave',
                handler: function (payload) {
                    var data = payload.entry.get('data');
                    if (!tagConfig) return data;
                    var tags = (data.get('tags') || '').trim();
                    if (tags) return data; // 手入力があれば優先
                    var inferred = inferTags(data.get('title') || '', data.get('body') || '');
                    return data.set('tags', inferred.join(', '));
                },
            });
        })();
    </script>
</body>
</html>
