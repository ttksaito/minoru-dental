name: 集客ダッシュボードの更新

# GA4 と Search Console からデータを取得して dashboard/data.json を更新する。
# Google 広告の数値は GA4 とのリンク経由で取得する（Ads API は使わない）。
# 起動は 3 通り:
#   1. repository_dispatch … Vercel Cron（api/cron/update-dashboard.js）が毎朝 5:00〜5:59 JST に叩く（本命）
#   2. schedule            … 予備。GitHub の定期実行は混雑で 2〜6 時間遅れるので、1 が動いた日は check ジョブでスキップする
#   3. workflow_dispatch   … 手動
on:
  repository_dispatch:
    types: [update-dashboard]
  schedule:
    - cron: '0 21 * * *' # 6:00 JST 指定だが実際は 8〜12 時ごろに動く（予備）
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.recent.outputs.skip }}
    steps:
      - name: 予備の定期実行なら、直近 12 時間以内に更新済みかを確認
        id: recent
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/${{ github.repository }}/commits?path=dashboard/data.enc&per_page=1" --jq '.[0].commit.committer.date')
          last_ts=$(date -d "$last" +%s)
          age_h=$(( ( $(date +%s) - last_ts ) / 3600 ))
          echo "dashboard/data.enc の最終更新: $last（${age_h} 時間前）"
          if [ "$age_h" -lt 12 ]; then
            echo "Vercel Cron 経由で更新済みのため、予備の定期実行はスキップします。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  update-dashboard:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Google Cloud に認証
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/522170574882/locations/global/workloadIdentityPools/github/providers/minoru-dental'
          service_account: 'ga4-popular-posts@minoru-dental.iam.gserviceaccount.com'
          token_format: 'access_token'
          access_token_scopes: 'https://www.googleapis.com/auth/analytics.readonly,https://www.googleapis.com/auth/webmasters.readonly,https://www.googleapis.com/auth/business.manage'

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: GA4・Search Console からデータを取得
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
          GBP_LOCATION_ID: ${{ vars.GBP_LOCATION_ID }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
          # ビジネスプロフィールは運営者アカウントの OAuth で取得（docs/ops/gbp-oauth-setup.md）。未設定ならサービスアカウントで試みる
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
        run: node scripts/fetch-dashboard-data.js

      - name: パスワード未設定なら中断（公開リポジトリに平文データを置かない）
        if: ${{ env.DASHBOARD_PASSWORD == '' }}
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          echo "::error::Secrets に DASHBOARD_PASSWORD がありません。設定してから再実行してください。"
          exit 1

      - name: 変更があればコミット・プッシュ
        run: |
          git pull --rebase --autostash
          if [ -z "$(git status --porcelain dashboard/data.enc dashboard/insights.json)" ]; then
            echo "変更なし。コミットをスキップします。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data.enc dashboard/insights.json
          git commit -m "集客ダッシュボードのデータを自動更新"
          git push
