name: ブログの自動ビルド

# content/blog/ のMarkdown、テンプレート、ビルドスクリプトが変更されたら
# 記事HTML・blog-posts.json・sitemap.xml を再生成してコミットする。
# （Decap CMSやGitHub Web UIからの記事追加を自動で公開反映するための仕組み）
on:
  push:
    branches:
      - main
    paths:
      - 'content/blog/**'
      - 'templates/**'
      - 'scripts/build-blog.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-blog:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 依存関係をインストール
        run: npm ci

      - name: ブログをビルド
        run: npm run build:blog

      - name: 変更があればコミット・プッシュ
        run: |
          git add blog blog-posts.json sitemap.xml
          if git diff --cached --quiet; then
            echo "変更なし。コミットをスキップします。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "ブログを自動ビルド"
          git pull --rebase origin main
          git push
