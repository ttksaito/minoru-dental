name: Clarity API の疎通確認（手動）

# Microsoft Clarity の API がトークンで呼べるか、応答の「項目名」だけを出す（値は出さない。ログは公開されるため）。
# 新しい取得項目を足す前の確認用。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: セッション一覧 API（/mcp/recordings/sample）を呼んで項目名だけ表示
        env:
          CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
        run: |
          node - <<'JS'
          const token = process.env.CLARITY_API_TOKEN;
          if (!token) { console.log('CLARITY_API_TOKEN が未設定'); process.exit(1); }
          // 値を出さずに構造だけを表示する
          const shape = (v, depth = 0) => {
            if (depth > 4) return '…';
            if (Array.isArray(v)) return v.length ? [`array(${v.length})`, shape(v[0], depth + 1)] : 'array(0)';
            if (v && typeof v === 'object') { const o = {}; for (const [k, x] of Object.entries(v)) o[k] = shape(x, depth + 1); return o; }
            return typeof v;
          };
          const end = new Date(); const start = new Date(end.getTime() - 3 * 86400000);
          const call = async (path, body) => {
            const res = await fetch(`https://clarity.microsoft.com/mcp${path}`, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` }, body: JSON.stringify(body) });
            const text = await res.text();
            console.log(`\n== POST ${path} → HTTP ${res.status}`);
            for (const h of ['x-ratelimit-limit', 'x-ratelimit-remaining', 'retry-after', 'x-request-id']) if (res.headers.get(h)) console.log(`  ${h}: ${res.headers.get(h)}`);
            if (!res.ok) { console.log('  本文（先頭 200 文字、値を含む可能性があるため機械的に数字を伏せる）:', text.slice(0, 200).replace(/[0-9]{3,}/g, '###')); return; }
            let data; try { data = JSON.parse(text); } catch (e) { console.log('  JSON でない応答'); return; }
            console.log('  構造:', JSON.stringify(shape(data), null, 1));
            // 文字列項目の「形式」だけ表示（数字は # に置換。滞在時間や時刻の書式・タイムゾーンを確かめる用）
            if (Array.isArray(data) && data[0] && typeof data[0] === 'object') {
              const mask = (v) => String(v).replace(/[0-9]/g, '#');
              const s0 = data[0];
              for (const k of ['timestamp', 'totalDuration', 'activeDuration']) if (k in s0) console.log(`  形式 ${k}: "${mask(s0[k])}" (${typeof s0[k]})`);
              const t0 = Array.isArray(s0.timeline) ? s0.timeline[0] : null;
              if (t0) for (const k of ['start', 'duration', 'pageLoadTime', 'LCP', 'CLS']) if (k in t0) console.log(`  形式 timeline[0].${k}: "${mask(t0[k])}" (${typeof t0[k]})`);
              // timestamp を UTC とみなしたときの「今からの経過時間」。一覧の先頭（最新）が未来になるなら UTC ではない
              const newest = data.map((s) => Date.parse(String(s.timestamp).replace(' ', 'T') + 'Z')).filter((n) => !Number.isNaN(n)).sort((a, b) => b - a)[0];
              if (newest) console.log(`  最新セッションの timestamp を UTC として解釈 → 今から ${((Date.now() - newest) / 3600000).toFixed(1)} 時間前`);
            }
          };
          (async () => {
            const date = { start: start.toISOString(), end: end.toISOString() };
            await call('/recordings/sample', { sortBy: 0, start: date.start, end: date.end, filters: { date }, count: 50 });
            // クリックが多いセッション（timelineEvents の形を見る）
            await call('/recordings/sample', { sortBy: 0, start: date.start, end: date.end, filters: { date, sessionClickEventCount: { min: 2, max: null } }, count: 2 });
            // 端末フィルタが効くか
            await call('/recordings/sample', { sortBy: 0, start: date.start, end: date.end, filters: { date, deviceType: ['Mobile'] }, count: 1 });
            // 自然文の問い合わせ（timezone 必須）。過去 30 日が取れるなら履歴の穴埋めに使える
            await call('/dashboard/query', { query: 'Sessions count by day for the last 30 days', timezone: 'Asia/Tokyo' });
            await call('/dashboard/query', { query: 'Average scroll depth by day for the last 30 days', timezone: 'Asia/Tokyo' });
          })();
          JS
