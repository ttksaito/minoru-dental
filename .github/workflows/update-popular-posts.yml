name: 人気記事ランキングの更新

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  update-popular-posts:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Google Cloud に認証
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/522170574882/locations/global/workloadIdentityPools/github/providers/minoru-dental'
          service_account: 'ga4-popular-posts@minoru-dental.iam.gserviceaccount.com'
          token_format: 'access_token'
          access_token_scopes: 'https://www.googleapis.com/auth/analytics.readonly'

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: GA4から人気記事データを集計
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node scripts/fetch-popular-posts.js

      - name: 変更があればコミット・プッシュ
        run: |
          if git diff --quiet popular-posts.json 2>/dev/null && [ -f popular-posts.json ]; then
            echo "変更なし。コミットをスキップします。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add popular-posts.json
          git commit -m "人気記事ランキングを自動更新"
          git push
