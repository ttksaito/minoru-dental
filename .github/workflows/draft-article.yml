name: 記事下書きの仕上げ（仮サムネ生成・PR 作成）

# AI（クラウドの定期エージェント）やローカルから cms/blog/<slug> ブランチに下書きが push されたら、
#   1. 仮サムネイル（blog/uploads/<slug>.png）がなければ生成してブランチにコミット
#   2. PR がなければ Decap CMS の形式（ラベル decap-cms/draft）で作成
# これで CMS の「ワークフロー」に下書きとして並び、人間はチェックして「公開」を押すだけになる。
on:
  push:
    branches:
      - 'cms/blog/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  finish-draft:
    runs-on: ubuntu-latest
    # 自分（bot）のコミットでは再実行しない
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: スラッグを決定
        id: slug
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          SLUG="${BRANCH#cms/blog/}"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          if [ ! -f "content/blog/$SLUG.md" ]; then
            echo "content/blog/$SLUG.md がありません。スキップします。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Node.js をセットアップ
        if: steps.slug.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 日本語フォントを入れる
        if: steps.slug.outputs.skip != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk > /dev/null

      - name: 仮サムネイルを生成（未作成の場合のみ）
        if: steps.slug.outputs.skip != 'true'
        id: thumb
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
        run: |
          if [ -f "blog/uploads/$SLUG.png" ] || [ -f "blog/uploads/$SLUG.webp" ] || [ -f "blog/uploads/$SLUG.jpg" ]; then
            echo "サムネイルは既にあります。生成をスキップします。"
            exit 0
          fi
          CHROME_BIN="$(command -v google-chrome || command -v chromium-browser || command -v chromium)" \
            node scripts/make-thumbnail.js "$SLUG"
          # frontmatter の image を生成したファイルに合わせる
          node -e '
            const fs=require("fs");const p="content/blog/"+process.env.SLUG+".md";
            let s=fs.readFileSync(p,"utf8");
            const img="/blog/uploads/"+process.env.SLUG+".png";
            if(/^image:.*$/m.test(s)) s=s.replace(/^image:.*$/m,"image: "+img); else s=s.replace(/^---\n/,"---\nimage: "+img+"\n");
            fs.writeFileSync(p,s);
          '
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "blog/uploads/$SLUG.png" "content/blog/$SLUG.md"
          git commit -m "仮サムネイルを生成: $SLUG"
          git push

      - name: PR がなければ作成（Decap CMS のワークフローに載せる。予備。エージェント側で作るのが基本）
        if: steps.slug.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ steps.slug.outputs.slug }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # エージェントが push 直後に REST で PR を作るので、少し待ってから確認する
          for i in $(seq 1 6); do
            if [ -n "$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')" ]; then
              echo "PR は既にあります。"
              exit 0
            fi
            sleep 10
          done
          TITLE="$(grep -m1 '^title:' "content/blog/$SLUG.md" | sed 's/^title:[[:space:]]*//; s/^"//; s/"$//')"
          NOTES=""
          if [ -f "content/.draft-notes/$SLUG.md" ]; then NOTES="$(cat "content/.draft-notes/$SLUG.md")"; fi
          gh label create "decap-cms/draft" --color ededed --force > /dev/null 2>&1 || true
          gh pr create --base main --head "$BRANCH" \
            --title "記事を追加: $SLUG" \
            --label "decap-cms/draft" \
            --body "$(printf 'Automatically generated by Decap CMS\n\n## AI 下書き: %s\n\nCMS のワークフロー（https://www.minoru-dental.jp/admin/#/workflow）で本文を確認し、必要なら直して「公開」してください。\n\n%s' "$TITLE" "$NOTES")"

      - name: 確認メールを送る（スマホからプレビュー・公開できるリンク付き）
        if: steps.slug.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ steps.slug.outputs.slug }}
          BRANCH: ${{ github.ref_name }}
          REVIEW_SECRET: ${{ secrets.REVIEW_SECRET }}
        id: mail
        run: |
          if [ -z "$REVIEW_SECRET" ] || [ -z "${{ secrets.MAIL_USERNAME }}" ] || [ -z "${{ secrets.MAIL_APP_PASSWORD }}" ] || [ -z "${{ secrets.MAIL_TO }}" ]; then
            echo "::warning::メール送信の Secrets（REVIEW_SECRET / MAIL_USERNAME / MAIL_APP_PASSWORD / MAIL_TO）が未設定のため、メールは送りません。CMS のワークフローから確認してください。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PR=""
          for i in $(seq 1 12); do
            PR="$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')"
            [ -n "$PR" ] && break
            sleep 10
          done
          if [ -z "$PR" ]; then
            echo "::warning::PR が見つからないためメールを送れません。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TOKEN="$(printf 'pr:%s' "$PR" | openssl dgst -sha256 -hmac "$REVIEW_SECRET" | awk '{print $NF}' | cut -c1-32)"
          REVIEW_URL="https://minoru-dental.vercel.app/api/review?pr=${PR}&t=${TOKEN}"
          TITLE="$(grep -m1 '^title:' "content/blog/$SLUG.md" | sed 's/^title:[[:space:]]*//; s/^"//; s/"$//')"
          SUMMARY="$(grep -m1 '^summary:' "content/blog/$SLUG.md" | sed 's/^summary:[[:space:]]*//; s/^"//; s/"$//')"
          THUMB="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${BRANCH}/blog/uploads/${SLUG}.png"
          NOTES=""
          if [ -f "content/.draft-notes/$SLUG.md" ]; then NOTES="$(sed 's/&/\&amp;/g; s/</\&lt;/g' "content/.draft-notes/$SLUG.md" | sed 's/$/<br>/')"; fi
          {
            echo "subject=【要確認】ブログ下書き: ${TITLE}"
            echo "review_url=${REVIEW_URL}"
            echo "html<<HTMLEOF"
            cat <<HTML
          <div style="font-family:-apple-system,'Hiragino Sans',sans-serif;max-width:600px;margin:0 auto;color:#333;line-height:1.7">
            <p style="font-size:13px;color:#388e3c;margin:0 0 4px">みのる歯科ブログ　AI 下書きができました</p>
            <h2 style="font-size:20px;margin:0 0 12px;line-height:1.4">${TITLE}</h2>
            <img src="${THUMB}" alt="" style="width:100%;height:auto;border-radius:8px;display:block;margin:0 0 12px">
            <p style="font-size:14px;color:#555;background:#f7faf7;border-left:4px solid #4caf50;padding:8px 12px;margin:0 0 20px">${SUMMARY}</p>
            <p style="text-align:center;margin:0 0 10px"><a href="${REVIEW_URL}" style="display:inline-block;background:#ff6b35;color:#fff;text-decoration:none;font-weight:bold;padding:14px 36px;border-radius:999px;font-size:16px">本文を確認する → 公開 / 没</a></p>
            <p style="font-size:12px;color:#888;text-align:center;margin:0 0 24px">リンク先で全文を読み、画面下の「公開する」か「没にする」を押してください。文章を直したい場合は <a href="https://www.minoru-dental.jp/admin/#/workflow" style="color:#388e3c">CMS</a> から。</p>
            <details style="font-size:12px;color:#666"><summary>AI の調査メモ（選んだ理由・参考 URL・自己確認）</summary><div style="margin-top:8px">${NOTES}</div></details>
          </div>
          HTML
            echo "HTMLEOF"
          } >> "$GITHUB_OUTPUT"

      - name: メール送信
        if: steps.slug.outputs.skip != 'true' && steps.mail.outputs.skip != 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          from: みのる歯科ブログ（自動）<${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: ${{ steps.mail.outputs.subject }}
          html_body: ${{ steps.mail.outputs.html }}
          convert_markdown: false
